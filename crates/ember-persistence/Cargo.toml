[package]
name = "ember-persistence"
description = "AOF and snapshot durability for ember"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
encryption = ["aes-gcm", "hkdf", "rand", "sha2", "zeroize"]
protobuf = []
vector = []

[dependencies]
thiserror = { workspace = true }
bytes = { workspace = true }
crc32fast = { workspace = true }
tracing = { workspace = true }

# optional: encryption at rest (AES-256-GCM)
aes-gcm = { version = "0.10", optional = true, features = ["zeroize"] }
hkdf = { version = "0.12", optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { version = "1", optional = true, features = ["derive"] }
rand = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
