name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --features protobuf,grpc -- -D warnings
      - name: check
        run: cargo check --workspace --features protobuf,grpc

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: cargo build --workspace --features protobuf,grpc
      - name: unit tests
        run: cargo test --workspace --features protobuf,grpc --exclude ember-integration-tests
      - name: integration tests
        run: cargo test -p ember-integration-tests --test integration -- --test-threads=1

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: cargo build --release
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ember-server
          path: target/release/ember-server

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint
        run: helm lint helm/ember
      - name: template
        run: helm template ember helm/ember

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t ember:ci .

  go-client:
    name: go client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: clients/ember-go/go.sum
      - name: build
        working-directory: clients/ember-go
        run: go build ./...
      - name: test
        working-directory: clients/ember-go
        run: go test ./...

  msrv:
    name: msrv (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check
        run: cargo check --workspace --features protobuf,grpc

  python-client:
    name: python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        working-directory: clients/ember-py
        run: pip install -e ".[dev]"
      - name: test
        working-directory: clients/ember-py
        run: pytest -v

  ts-client:
    name: ts client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/ember-ts/package-lock.json
      - name: install
        working-directory: clients/ember-ts
        run: npm ci
      - name: build
        working-directory: clients/ember-ts
        run: npm run build

  proto-drift:
    name: client proto drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check clients against canonical proto
        run: ./scripts/check-client-drift.sh

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit
      - name: audit
        run: cargo audit
